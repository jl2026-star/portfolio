<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jordan Lane — Reel & Portfolio</title>
<meta name="description" content="Selected work — sizzle reels, brand films, and creative direction." />
<meta property="og:title" content="Jordan Lane — Reel & Portfolio" />
<meta property="og:description" content="Selected work — sizzle reels, brand films, and creative direction." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0a;--bg-card:#181818;--border:#262626;--text:#f5f3ee;--text-dim:#8a8a85;--text-faint:#555;--accent:#c9a961;--serif:"Fraunces",Georgia,serif;--sans:"Inter",-apple-system,sans-serif;--max-w:1280px;--pad:clamp(20px,4vw,56px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:22px var(--pad);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px);background:rgba(10,10,10,.65);border-bottom:1px solid transparent;transition:border-color .3s}
nav.scrolled{border-bottom-color:var(--border)}
.brand{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.nav-links{display:flex;gap:28px;list-style:none;font-size:13px;text-transform:uppercase;letter-spacing:.15em;font-weight:500}
.nav-links a{color:var(--text-dim);transition:color .25s;position:relative}
.nav-links a:hover{color:var(--text)}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-6px;height:1px;width:0;background:var(--accent);transition:width .3s}
.nav-links a:hover::after{width:100%}
@media(max-width:640px){.nav-links{gap:14px;font-size:11px}}
.hero{min-height:100vh;padding:120px var(--pad) 80px;display:flex;flex-direction:column;justify-content:center;position:relative;max-width:var(--max-w);margin:0 auto}
.hero-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.3em;color:var(--accent);margin-bottom:28px;display:flex;align-items:center;gap:14px}
.hero-eyebrow::before{content:"";width:32px;height:1px;background:var(--accent)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(56px,11vw,168px);line-height:.92;letter-spacing:-.04em;margin-bottom:32px}
.hero h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.hero-tagline{font-size:clamp(17px,1.6vw,22px);color:var(--text-dim);max-width:620px;line-height:1.5;margin-bottom:48px}
.hero-meta{display:flex;flex-wrap:wrap;gap:28px 56px;font-size:13px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.15em}
.hero-meta strong{display:block;color:var(--text);font-family:var(--serif);text-transform:none;letter-spacing:-.01em;font-size:15px;font-weight:400;margin-top:6px}
.scroll-cue{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:11px;text-transform:uppercase;letter-spacing:.3em;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;gap:12px;animation:float 2.4s ease-in-out infinite}
.scroll-cue::after{content:"";width:1px;height:40px;background:linear-gradient(to bottom,var(--text-faint),transparent)}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
section{padding:120px var(--pad);max-width:var(--max-w);margin:0 auto;position:relative;z-index:2}
.section-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:64px;flex-wrap:wrap;gap:24px;border-bottom:1px solid var(--border);padding-bottom:28px}
.section-header h2{font-family:var(--serif);font-weight:300;font-size:clamp(36px,5vw,64px);letter-spacing:-.03em;line-height:1}
.section-header h2 em{font-style:italic;color:var(--accent)}
.section-num{font-size:12px;color:var(--text-faint);letter-spacing:.2em;text-transform:uppercase}
.reels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:40px 32px}
.reel{display:flex;flex-direction:column;gap:16px}
.reel-frame{position:relative;aspect-ratio:16/9;background:var(--bg-card);border:1px solid var(--border);overflow:hidden;transition:border-color .3s,transform .4s}
.reel:hover .reel-frame{border-color:var(--accent);transform:translateY(-2px)}
.reel-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reel-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:4px}
.reel-title{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.01em}
.reel-tag{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--text-faint);white-space:nowrap}
.featured-reel{max-width:1000px;margin:0 auto}
.featured-reel .reel-frame{margin-bottom:24px}
.featured-reel .reel-meta{justify-content:space-between}
.featured-reel .reel-title{font-size:28px}
.feature-photo{width:100%;border:1px solid var(--border);overflow:hidden;background:var(--bg-card)}
.feature-photo img{width:100%;height:auto;display:block}
.about-wrap{display:grid;grid-template-columns:1fr 1.4fr;gap:80px;align-items:start}
@media(max-width:900px){.about-wrap{grid-template-columns:1fr;gap:40px}}
.about-label{font-size:12px;text-transform:uppercase;letter-spacing:.3em;color:var(--accent);padding-top:12px;border-top:1px solid var(--accent);display:inline-block}
.about-body p{font-size:clamp(18px,1.6vw,22px);line-height:1.55;margin-bottom:24px;font-weight:300}
.about-body
